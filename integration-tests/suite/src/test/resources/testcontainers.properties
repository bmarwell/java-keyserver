# Testcontainers configuration for the keyserver integration tests.
#
# Ryuk is disabled globally here because:
#   1. Podman rootless (the preferred local runtime) does not grant Ryuk the
#      root access it needs to remove containers and networks.
#   2. The KeyserverContainerExtension implements CloseableResource so JUnit
#      shuts down all containers cleanly after the last test class in the session.
#
# If you change the runtime to a full Docker daemon and want Ryuk re-enabled,
# remove this file or set ryuk.disabled=false.
ryuk.disabled=true
